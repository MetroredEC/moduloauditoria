<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso | Auditoría Médica Metrored</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <div class="login-screen standalone">
    <div class="login-card">
      <div class="brand brand-top-left">
        <img id="loginBrandLogo" class="logo-img hidden" alt="Logo Metrored" />
        <div class="logo-mark" aria-hidden="true">M</div>
        <div class="brand-text">
          <p class="eyebrow">Auditoría clínica</p>
          <div class="brand-title-line">
            <h1>Metrored Quality Insurance</h1>
            <span id="loginFaviconBadge" class="favicon-badge hidden" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="login-form">
        <h2>Ingreso seguro</h2>
        <p class="muted">Accede con tus credenciales Metrored para ver los módulos.</p>
        <label for="username">Usuario</label>
        <input id="username" placeholder="Usuario" autocomplete="username" />
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" />
        <button id="loginBtn" class="primary full">Ingresar</button>
        <p id="loginStatus" class="muted"></p>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
