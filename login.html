<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso - Auditoría Médica</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-card">
      <h1>Auditoría Médica</h1>
      <p class="login-subtitle">Inicia sesión con tus credenciales para continuar.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Ingresar</button>
        <p id="loginError" class="error-message" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="auth.js"></script>
  <script>
    // Maneja el envío del formulario y valida las credenciales.
    document.addEventListener('DOMContentLoaded', () => {
      const existing = getCurrentUser();
      if (existing) {
        window.location.href = 'index.html';
        return;
      }
      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errorEl.textContent = '';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const result = login(username, password);
        if (result.success) {
          window.location.href = 'index.html';
        } else {
          errorEl.textContent = result.message || 'No se pudo iniciar sesión.';
        }
      });
    });
  </script>
</body>
</html>
